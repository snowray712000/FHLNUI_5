<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Table Demo v12 — 標準 DText 轉換流程</title>
  <link rel="stylesheet" href="12_smart_table_joTable_demo.css">
</head>
<body>

<h2>Smart Table Demo v12 — 標準 DText 轉換流程（以弗所書第3章）</h2>
<p class="desc">
  在 11 版的 API fetch 基礎上，加入標準轉換管道：<br>
  <code>bible_text</code> → <code>cvt_others()</code> → <code>DText[]</code>
  → <code>dtexts_render()</code> → DOM
</p>

<p id="loading-status">載入中…</p>

<div class="layout">

  <!-- TableRenderer 動態生成 table，掛入此容器 -->
  <div id="table-container"></div>

  <div id="panel">
    <h3>選取狀態</h3>
    <div id="mode-badge" class="badge-none">— 尚未選取 —</div>
    <div id="status-detail"></div>

    <button id="btn-sn">隱藏 SN</button>
    <button id="btn-copy" disabled>📋 複製</button>

    <label>複製結果：</label>
    <div id="copy-output">（尚未複製）</div>
  </div>

</div>

<!-- Context Menu -->
<div id="ctx-menu"></div>

<!-- jQuery 需在 module 之前載入，dtexts_render 使用全域 $ -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
        crossorigin="anonymous"></script>
<script type="module" src="12_smart_table_joTable_demo.js"></script>
</body>
</html>

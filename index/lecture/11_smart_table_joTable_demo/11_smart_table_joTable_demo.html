<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Table Demo v11 — 真實 API 取經文</title>
  <link rel="stylesheet" href="11_smart_table_joTable_demo.css">
</head>
<body>

<h2>Smart Table Demo v11 — 真實 API 取經文（以弗所書第3章）</h2>
<p class="desc">
  固定查詢 <b>以弗所書第3章</b>，譯本：<b>unv / kjv / rcuv</b>。<br>
  直接將 API 回傳的 <code>bible_text</code> 放入表格，不處理特殊格式（rcuv 合併節顯示 "a"）。
</p>

<p id="loading-status">載入中…</p>

<div class="layout">

  <!-- TableRenderer 動態生成 table，掛入此容器 -->
  <div id="table-container"></div>

  <div id="panel">
    <h3>選取狀態</h3>
    <div id="mode-badge" class="badge-none">— 尚未選取 —</div>
    <div id="status-detail"></div>

    <button id="btn-copy" disabled>📋 複製</button>

    <label>複製結果：</label>
    <div id="copy-output">（尚未複製）</div>
  </div>

</div>

<!-- Context Menu -->
<div id="ctx-menu"></div>

<script type="module" src="11_smart_table_joTable_demo.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <title>TSK 3 測試</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./../../index/fhl.css">
    <style>
        .tsk_content, .comment_content >ul {
             list-style: none; margin: 0; padding-left: 0.5rem;
        }
        .tsk_content,  .comment_content > li {
            margin: .15em 0; 
        }
        .hanging-indent { padding-left: 0.5rem; text-indent: -0.5rem; }
        .marker {
            display: inline-block;
            min-width: 0.125rem;
        }
    </style>
</head>

<body>
    <div class="toolbar">

        <button id="btnPrev" class="btn btn-sm btn-outline-secondary">前</button>
        <button id="btnNext" class="btn btn-sm btn-outline-secondary">後</button>
        <button id="btnCreate" class="btn btn-sm btn-outline-secondary">創1:1</button>
        <button id="btnSettings" class="btn btn-sm btn-outline-secondary">設定</button>
        <button id="btnExplain" class="btn btn-sm btn-outline-secondary">說明</button>

        <button id="btnGet" class="btn btn-sm btn-primary">取得</button>

        <input id="inpBook" type="number" value="1" min="1" style="width:66px;">
        <input id="inpChap" type="number" value="3" min="1" style="width:66px;">
        <input id="inpSec" type="number" value="1" min="1" style="width:66px;">
    </div>

    <div id="parsedContent" class="tsk_content comment_content">(尚未處理)</div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script type="module" src="./tsk3_test.js"></script>
</body>

</html>
